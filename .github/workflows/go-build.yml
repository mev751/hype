name: go build

on:
  push:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "hype.toml"
      - ".github/workflows/go-build.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test（签名向量/配置解析）
        run: go test -v ./...

      - name: go build (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/hlstrat-linux-amd64 ./cmd/hlstrat
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: hlstrat-linux-amd64
          path: dist/hlstrat-linux-amd64
          if-no-files-found: error
