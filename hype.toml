# ==========================================================
# HL SKHY/SKHX 相对价值做空网格机器人 —— 参数配置
#
# 本文件保存后 1 秒内自动热加载，无需重启进程。
# 只影响加载之后的建仓/止盈判断，已建立的仓位不会被追溯调整。
# 解析失败时程序保留旧配置并打印错误（不会带病运行）。
# ==========================================================

# ---------- 网格策略（热加载） ----------
[strategy]
q_usdc = 1500.0     # 每层每条腿的目标名义价值 (USDC)
split_n = 1         # 单次网格订单切分次数，必须 >= 1
max_grids = 14      # 最大建仓层数
p1 = 1.45           # 建仓触发基准线：K >= p1 + 已持层数 * step_x 时建一层
step_x = 0.003      # 网格步长
slice_delay = 0.75  # 切片间隔（秒），split_n > 1 时生效
leverage = 5.0      # 期望杠杆（1~10）；改动后在实盘会自动同步到交易所
ema_alpha = 0.25    # K 值 EMA 平滑系数（0,1]

# 参数依据（2026-11-08，近 14 天数据 + 5x 杠杆，预算 10000 USDC）：
#   * 区间 1.45~1.49，p1 + step_x*max_grids 覆盖 1.450~1.489
#   * 日均振幅中位数 ≈ 0.022；step_x=0.003 贴住现价
#   * 上破 1.489 封顶 14 层只能满仓扛回撤；下破 1.447 全堆清空
#   * Q=1500×10 层 = 15000U/腿（30000U 对名义）；满载 14 层 = 21000U/腿
#   * growthMode taker≈0.009%，单格 4 笔手续费≈0.54U，净利≈2.5U

# ---------- 下单与行情执行（热加载） ----------
[execution]
pair_slippage_pct = 0.02          # IOC 限价相对盘口的最大滑点（0.02 = 2%）
price_max_age = 5.0               # 任一腿盘口超过该秒数即禁止交易
hedge_imbalance_tolerance = 0.15  # 两腿名义价值最大允许偏差（0.15 = 15%）
margin_buffer_multiplier = 1.5    # 新增一层前要求的最低保证金缓冲倍数
fill_wait = 1.0                   # 下单后等待成交回报的秒数
order_retries = 3                 # 单腿下单重试次数（含请求异常）
max_actions_per_tick = 20         # 单次行情最多串行处理的网格动作数

# ---------- 风控（热加载） ----------
[risk]
stop_loss_usdc = 0.0                     # 浮动亏损 ≤ -该值 时紧急全平；0 表示关闭
flatten_on_exit = false                  # 退出时是否自动平仓（默认不平）
auto_flatten_on_error = true             # 成对下单失败且回滚失败时尝试清空两腿
auto_flatten_on_reconcile_error = false  # 链上仓位异常时是否自动平仓（默认只停机）

# ---------- 交易所侧（仅启动时读取） ----------
[exchange]
enforce_leverage = true  # 启动时把两只标的设置为 strategy.leverage 倍全仓
